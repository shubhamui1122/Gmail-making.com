<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Admin Core Terminal</title>
    <style>
        /* 🌌 INDUSTRIAL SUB-ADMIN NEON DARK STYLES */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d091a; color: #d5cae8; padding: 15px; }
        .admin-container { max-width: 700px; margin: 0 auto; }
        .header-bar { background-color: #160f29; padding: 15px; border-radius: 8px; text-align: center; border-bottom: 2px solid #8a2be2; margin-bottom: 20px; }
        .header-bar h1 { color: #8a2be2; font-size: 20px; text-shadow: 0 0 8px rgba(138,43,226,0.4); }
        
        /* 📊 WORKER ACTIVE STATS COMPONENT */
        .card { background-color: #160f29; border: 1px solid #4a347a; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .timer-badge { background-color: #ff007f; color: #fff; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 13px; }
        .stat-grid { display: flex; gap: 10px; margin-top: 10px; }
        .stat-box { flex: 1; background-color: #0d091a; padding: 10px; border-radius: 6px; text-align: center; border: 1px solid #322154; }
        .stat-val { font-size: 20px; font-weight: bold; color: #00ffcc; }
        
        /* 📦 INPUT MATRIX & LIST NODES */
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; margin-bottom: 4px; font-size: 13px; color: #a295c2; }
        .input-group input { width: 100%; padding: 10px; background-color: #0d091a; border: 1px solid #4a347a; border-radius: 6px; color: #fff; outline: none; }
        .input-group input:focus { border-color: #ff007f; }
        .action-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #8a2be2, #ff007f); border: none; border-radius: 6px; color: #fff; font-weight: bold; cursor: pointer; }
        
        .list-item { background-color: #0d091a; padding: 12px; border-radius: 6px; border-left: 3px solid #ff007f; margin-bottom: 8px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
        .success-sm-btn { background-color: #00ffcc; color: #0d091a; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- AUTH GATE -->
        <div id="admin-auth" class="card" style="max-width: 400px; margin: 40px auto;">
            <h3 style="color: #ff007f; margin-bottom: 15px; text-align: center;">Worker Desk Gateway</h3>
            <div class="input-group">
                <input type="text" id="worker-id" placeholder="Enter Admin Node User">
            </div>
            <div class="input-group">
                <input type="password" id="worker-pass" placeholder="Enter Secure Password PIN">
            </div>
            <button class="action-btn" onclick="loginWorker()">Initialize Session</button>
            <p id="auth-msg" style="color:#ff007f; margin-top:10px; font-size:13px; text-align:center;"></p>
        </div>

        <!-- MAIN SUB-ADMIN CONTROL ROOM FRAMEWORK -->
        <div id="admin-dashboard" class="hidden">
            <div class="header-bar">
                <h1>WORKER CONTROL CENTER Core v3.0</h1>
                <p style="font-size:12px; margin-top:5px; color:#a295c2;">
                    🔒 Duty Active: <span id="duty-timer" class="timer-badge">00:00:00</span>
                </p>
            </div>

            <!-- 📊 AUDIT METRICS DISPATCH -->
            <div class="card">
                <h3 style="font-size:15px; color:#00ffcc; margin-bottom:10px;">Active Problems Counter & Registry</h3>
                <div class="stat-grid">
                    <div class="stat-box">
                        <div class="stat-val" id="stat-users">0</div>
                        <div style="font-size:11px; color:#a295c2;">Registered Nodes</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="stat-pending" style="color:#ff007f;">0</div>
                        <div style="font-size:11px; color:#a295c2;">Pending UTR Audits</div>
                    </div>
                </div>
            </div>

            <!-- 🔐 REMOTE PASSWORD OVERRIDE OVERHAUL (सब-एडमिन रिमोट डेस्क) -->
            <div class="card" style="border-color: #ff007f;">
                <h3 style="font-size:15px; color:#ff007f; margin-bottom:12px;">🔑 Client Password Override Desk</h3>
                <div class="input-group">
                    <label>Target Client Mobile Number</label>
                    <input type="text" id="reset-target-phone" placeholder="Enter user mobile node">
                </div>
                <div class="input-group">
                    <label>Assign Brand New Secret Password PIN</label>
                    <input type="text" id="reset-target-pass" placeholder="Enter fresh security PIN">
                </div>
                <button class="action-btn" style="background:#ff007f;" onclick="executePasswordOverride()">Force Update Credentials</button>
                <p id="reset-msg" style="margin-top:10px; font-size:13px; font-weight:bold;"></p>
            </div>

            <!-- 📦 MY TOTAL ORDERS (VIEWS & FOLLOWERS QUEUE) -->
            <div class="card">
                <h3 style="font-size:15px; color:#8a2be2; margin-bottom:12px;">My Total Orders (Views & Followers Queue)</h3>
                <div id="pending-utr-list">
                    <p style="color:#a295c2; font-size:13px;">Scanning database pipeline for active deposit requests...</p>
                </div>
            </div>
            
            <button class="action-btn" style="background:#322154; margin-top:10px;" onclick="location.reload()">Terminate Session (Log Out)</button>
        </div>
    </div>

    <!-- ⚡ SUB-ADMIN RUNTIME EXECUTION SCRIPTS -->
    <script>
        let currentWorkerNode = "";
        let dutySeconds = 0;
        let dataRefreshInterval = null;

        function startDutyTimer() {
            setInterval(() => {
                dutySeconds++;
                let hrs = String(Math.floor(dutySeconds / 3600)).padStart(2, '0');
                let mins = String(Math.floor((dutySeconds % 3600) / 60)).padStart(2, '0');
                let secs = String(dutySeconds % 60).padStart(2, '0');
                document.getElementById('duty-timer').innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        function loginWorker() {
            const user = document.getElementById('worker-id').value.trim();
            const pass = document.getElementById('worker-pass').value.trim();
            
            // सब-एडमिन वर्कर्स का लॉगिन (आप अपने वर्कर्स को यह क्रेडेंशियल दे सकते हैं)
            if((user === "worker1" && pass === "balia123") || (user === "OWNERSHUBHAM11" && pass === "8734812286")) {
                currentWorkerNode = user;
                document.getElementById('admin-auth').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                startDutyTimer();
                loadWorkerDashboardData();
                dataRefreshInterval = setInterval(loadWorkerDashboardData, 4000); // हर 4 सेकंड में लाइव आर्डर लिस्ट लोड होगी
            } else {
                document.getElementById('auth-msg').innerText = "Access Denied: Invalid Worker Node Credentials!";
            }
        }

        async function loadWorkerDashboardData() {
            try {
                // स्टेट्स लोड करना
                const statsRes = await fetch('/api/admin/stats');
                const stats = await statsRes.json();
                document.getElementById('stat-users').innerText = stats.usersCount;
                
                // पेंडिंग आर्डर्स/UTR लिस्ट लोड करना
                const listRes = await fetch('/api/admin/pending-payments');
                const list = await listRes.json();
                document.getElementById('stat-pending').innerText = list.length;
                
                const container = document.getElementById('pending-utr-list');
                if (list.length === 0) {
                    container.innerHTML = `<p style="color:#a295c2; font-size:13px;">🟢 All order channels clear. No pending approvals found.</p>`;
                    return;
                }
                
                container.innerHTML = "";
                list.forEach(p => {
                    let div = document.createElement('div');
                    div.className = "list-item";
                    div.innerHTML = `
                        <div>
                            <strong style="color:#00ffcc;">@${p.username}</strong><br>
                            <span style="color:#a295c2; font-size:12px;">Amount: ₹${p.amount} | UTR: ${p.utr}</span>
                        </div>
                        <button class="success-sm-btn" onclick="approvePaymentNode('${p.id}')">Success</button>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {}
        }

        async function approvePaymentNode(id) {
            if(!confirm("क्या आप इस यूज़र का बैलेंस पक्का 'Success' करना चाहते हैं?")) return;
            const res = await fetch('/api/admin/verify-payment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ paymentId: id, action: 'success', adminName: currentWorkerNode })
            });
            const data = await res.json();
            if(data.success) {
                loadWorkerDashboardData();
            }
        }

        // 🔐 LIVE PASSWORD OVERRIDE LOGIC (सब-एडमिन द्वारा सीधे डेटाबेस में नया पासवर्ड लॉक करना)
        async function executePasswordOverride() {
            const username = document.getElementById('reset-target-phone').value.trim();
            const newPassword = document.getElementById('reset-target-pass').value.trim();
            const msgEl = document.getElementById('reset-msg');
            
            if(!username || !newPassword) {
                msgEl.style.color = "#ff007f";
                msgEl.innerText = "Please fill target number and new PIN!";
                return;
            }
            
            msgEl.style.color = "#00ffcc";
            msgEl.innerText = "Transmitting override packet to database...";
            
            const res = await fetch('/api/admin/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, newPassword, adminName: currentWorkerNode })
            });
            const data = await res.json();
            if(data.success) {
                msgEl.style.color = "#00ffcc";
                msgEl.innerText = `✅ Client @${username} password forcefully changed successfully!`;
                document.getElementById('reset-target-phone').value = "";
                document.getElementById('reset-target-pass').value = "";
            } else {
                msgEl.style.color = "#ff007f";
                msgEl.innerText = `❌ Error: ${data.message}`;
            }
        }
